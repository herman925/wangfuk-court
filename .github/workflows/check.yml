name: Check data and filters
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -c "import json; from tools.update_snapshot import validate_snapshot; validate_snapshot(json.load(open('docs/data/snapshot.json', encoding='utf-8')))"
